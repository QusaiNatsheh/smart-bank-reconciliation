[options]
addons_path = /mnt/extra-addons
data_dir = /var/lib/odoo
; Odoo 20 listens on 127.0.0.1 by default, which is unreachable from outside the container.
http_interface = 0.0.0.0
db_host = db
db_port = 5432
db_user = odoo
db_password = odoo
; Demo-only passwords. Change them for any non-local use.
admin_passwd = admin
