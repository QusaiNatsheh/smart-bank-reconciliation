services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo"]
      interval: 5s
      retries: 10

  ml:
    build: ./ml
    image: smart-reconcile-ml:latest
    ports:
      - "8000:8000"
    volumes:
      - feedback:/app/feedback
      - demo-data:/app/export  # the image's demo.json is copied into this volume on first start
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      retries: 10

  mlflow:
    pull_policy: never  # built locally by the ml service
    image: smart-reconcile-ml:latest  # same image as the service, so MLflow shows the model being served
    depends_on:
      - ml
    command: ["mlflow", "ui", "--backend-store-uri", "sqlite:////app/mlflow.db", "--host", "0.0.0.0", "--port", "5000"]
    ports:
      - "5000:5000"

  odoo:
    image: odoo:19.0
    depends_on:
      db:
        condition: service_healthy
      ml:
        condition: service_healthy
    ports:
      - "8069:8069"
    volumes:
      - ./addons:/mnt/extra-addons
      - ./scripts:/mnt/scripts:ro
      - ./config/odoo.conf:/etc/odoo/odoo.conf:ro
      - demo-data:/mnt/data:ro
      - odoo-data:/var/lib/odoo

volumes:
  db-data:
  odoo-data:
  feedback:
  demo-data:
